        }

            background: rgba(30, 41, 59, 0.95);
            border-bottom: 1px solid #374151;
            padding: 1.5rem 2rem;

            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: #3b82f6;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #dc2626;
            color: white;
        }

        .btn-secondary:hover {
            background: #b91c1c;
        }

        .btn-outline {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #4b5563;
        }

        .btn-outline:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .search-bar {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .search-input {
            width: 100%;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: #f8fafc;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            color: #9ca3af;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            color: #3b82f6;
            font-size: 2rem;
            font-weight: 700;
        }

            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #374151;
        }

            color: #e2e8f0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;

        .link-card {
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            padding: 1rem;
            transition: all 0.2s;
            text-decoration: none;
            display: block;

            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);

        }

        .hidden {

        }

            color: #9ca3af;

                { title: 'Depreciation Calculator', path: 'app/tools/depreciation-calculator.html' },
                { title: 'Document Production Checklist', path: 'app/tools/document-production-checklist.html' },
                { title: 'Download Policy Report', path: 'app/tools/download-policy-report.html' },
                { title: 'Download Submission Report', path: 'app/tools/download-submission-report.html' },
                { title: 'Endorsement Opportunity Identifier', path: 'app/tools/endorsement-opportunity-identifier.html' },
                { title: 'Escalation Readiness Checker', path: 'app/tools/escalation-readiness-checker.html' },
                { title: 'Estimate Comparison', path: 'app/tools/estimate-comparison.html' },
                { title: 'Estimate Review', path: 'app/tools/estimate-review.html' },
                { title: 'Estimate Revision Request Generator', path: 'app/tools/estimate-revision-request-generator.html' },
                { title: 'EUO Sworn Statement Guide', path: 'app/tools/euo-sworn-statement-guide.html' },
                { title: 'Expense Upload Tool', path: 'app/tools/expense-upload-tool.html' },
                { title: 'Followup Schedule View', path: 'app/tools/followup-schedule-view.html' },
                { title: 'Followup Status Letter', path: 'app/tools/followup-status-letter.html' }
            ]
        };

        // Render links
        function renderLinks() {
            const mainLinks = document.getElementById('main-links');
            const appLinks = document.getElementById('app-links');
            const seoWaterLinks = document.getElementById('seo-water-links');
            const seoGeneralLinks = document.getElementById('seo-general-links');
            const toolsLinks = document.getElementById('tools-links');

            pages.main.forEach(page => {
                mainLinks.innerHTML += createLinkCard(page);
            });

            pages.app.forEach(page => {
                appLinks.innerHTML += createLinkCard(page);
            });

            pages.seoWater.forEach(page => {
                seoWaterLinks.innerHTML += createLinkCard(page);
            });

            pages.seoGeneral.forEach(page => {
                seoGeneralLinks.innerHTML += createLinkCard(page);
            });

            pages.tools.forEach(page => {
                toolsLinks.innerHTML += createLinkCard(page);
            });

            // Update counts
            document.getElementById('total-pages').textContent = 
                pages.main.length + pages.app.length + pages.seoWater.length + pages.seoGeneral.length + pages.tools.length;
            document.getElementById('main-pages').textContent = pages.main.length;
            document.getElementById('app-pages').textContent = pages.app.length;
            document.getElementById('seo-pages').textContent = pages.seoWater.length + pages.seoGeneral.length;
            document.getElementById('tool-pages').textContent = pages.tools.length;

            document.getElementById('count-main').textContent = pages.main.length;
            document.getElementById('count-app').textContent = pages.app.length;
            document.getElementById('count-seo-water').textContent = pages.seoWater.length;
            document.getElementById('count-seo-general').textContent = pages.seoGeneral.length;
            document.getElementById('count-tools').textContent = pages.tools.length;
        }

        function createLinkCard(page) {
            return `
                <a href="${page.path}" class="link-card" target="_blank">
                    <div class="link-title">${page.title}</div>
                    <div class="link-path">${page.path}</div>
                </a>
            `;
        }

        function filterPages() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const allCards = document.querySelectorAll('.link-card');
            
            allCards.forEach(card => {
                const title = card.querySelector('.link-title').textContent.toLowerCase();
                const path = card.querySelector('.link-path').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || path.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function toggleSection(button) {
            const section = button.closest('.section');
            const content = section.querySelector('.section-content');
            
            if (content.style.maxHeight === '0px' || content.style.maxHeight === '') {
                content.style.maxHeight = '0px';
                button.textContent = 'Expand';
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                button.textContent = 'Collapse';
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('adminAuthenticated');
                sessionStorage.removeItem('adminLoginTime');
                window.location.href = 'admin-login.html';
            }
        }

        // Initialize
        renderLinks();
    </script>
</body>
